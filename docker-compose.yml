services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comamos
      POSTGRES_PASSWORD: comamos
      POSTGRES_DB: comamos
    volumes:
      - comamos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comamos -d comamos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://comamos:comamos@db:5432/comamos?schema=public"
      SESSION_SECRET: "change-me-in-production"
      NODE_ENV: "production"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      VAPID_FILE: "/data/vapid.json"
      WHATSAPP_TOKEN: ""
      WHATSAPP_PHONE_NUMBER_ID: ""
      WHATSAPP_API_VERSION: "v18.0"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  comamos-pg: